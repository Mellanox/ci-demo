---
job: ci-demo-stages-example

kubernetes:
  cloud: swx-k8s-spray

runs_on_dockers:
  - {name: 'ubuntu2204', url: 'ubuntu:22.04', arch: 'x86_64'}
  - {name: 'rhel9', url: 'redhat/ubi9', arch: 'x86_64'}

# Steps are assigned to Jenkins stages based on the 'stage' field.
# All steps with the same 'stage' value are grouped together and executed sequentially within that stage block.
# Steps without a 'stage' field are assigned to a default stage and executed in order.

steps:
  - name: Build lib
    run: echo "building lib"
    stage: build

  - name: Build tools
    run: echo "building tools"
    stage: build

  - name: Build docs
    run: echo "building docs"
    stage: build

  - name: Unit tests
    run: echo "running unit tests"
    stage: test

  - name: Integration tests
    run: echo "running integration tests"
    stage: test

  - name: Publish
    containerSelector: "{name:'ubuntu2204'}"
    stage: publish
    run: echo "publishing artifacts"
