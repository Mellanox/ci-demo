---
# Example: a single imagePullSecrets name, as a one-item YAML list;
# `imagePullSecrets: ci-demo-pull-a` is equivalent.
# GitHub Actions CI runs this file (.github/workflows/ci.yml).
job: ci-k8-pull-secrets-name

kubernetes:
  cloud: swx-k8s
  namespace: default
  serviceAccount: jenkins
  limits: "{memory: 1Gi, cpu: 500m}"
  requests: "{memory: 256Mi, cpu: 250m}"
  imagePullSecrets: [ci-demo-pull-a]
  arch_table:
    x86_64:
      nodeSelector: "kubernetes.io/os=linux,kubernetes.io/arch=amd64"
      jnlpImage: "jenkins/inbound-agent:latest"
    aarch64:
      nodeSelector: "kubernetes.io/os=linux,kubernetes.io/arch=arm64"
      jnlpImage: "jenkins/inbound-agent:latest"

runs_on_dockers:
  - {name: "ubuntu-x86_64", url: "ubuntu:22.04", arch: "x86_64"}
  - {name: "ubuntu-aarch64", url: "ubuntu:22.04", arch: "aarch64"}

matrix:
  axes:
    arch:
      - x86_64
      - aarch64
  include:
    - {arch: '${TARGET_ARCH}'}

steps:
  - name: Pod started
    run: echo "pod for ${name} started"

failFast: false
